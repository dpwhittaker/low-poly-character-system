<!doctype html><html><body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import * as B from './core/index.js';
const q = new URLSearchParams(location.search);
const N = +(q.get('n') ?? 100), NB = +(q.get('bones') ?? 30), PARTS = +(q.get('parts') ?? 6), TRIS = +(q.get('tris') ?? 3000);
const MERGE = q.get('merge') === '1', MAT = q.get('mat') ?? 'std', ANIM = q.get('anim') ?? '1', UNIQUEMAT = q.get('umat') !== '0';
const canvas = document.getElementById('c');
const engine = new B.Engine(canvas, false, { preserveDrawingBuffer: false, stencil: false });
const scene = new B.Scene(engine);
scene.useConstantAnimationDeltaTime = true;
const cam = new B.ArcRotateCamera('cam', -Math.PI / 2, 1.1, 30, B.Vector3.Zero(), scene);
new B.HemisphericLight('h', new B.Vector3(0, 1, 0), scene);
const sharedMat = MAT === 'pbr' ? new B.PBRMaterial('pm', scene) : new B.StandardMaterial('sm', scene);
function mkAnim(name, prop, type, keysFn) { const a = new B.Animation(name, prop, 30, type, 1); const k = []; for (let f = 0; f <= 60; f++) k.push({ frame: f, value: keysFn(f) }); a.setKeys(k); return a; }
const trisPerPart = TRIS / PARTS; const SKS=[], GRPS=[], LOD=+(q.get('lod')??1), OPT=q.get('opt')??'';
for (let c = 0; c < N; c++) {
  const sk = new B.Skeleton('sk' + c, 'sk' + c, scene);
  const root = new B.TransformNode('root' + c, scene);
  root.position.set((c % 10) * 2.5 - 11, 0, Math.floor(c / 10) * 2.5 - 11);
  const g = new B.AnimationGroup('g' + c, scene);
  for (let b = 0; b < NB; b++) {
    const pIdx = b === 0 ? -1 : (b % 6 === 1 ? 0 : b - 1);
    const bone = new B.Bone('b' + b, sk, pIdx < 0 ? null : sk.bones[pIdx], B.Matrix.Translation(0, b === 0 ? 0 : 0.06, 0));
    let tn = bone; bone.rotationQuaternion = B.Quaternion.Identity();
    if (q.get('tn') !== '0') { tn = new B.TransformNode('n' + c + '_' + b, scene);
    tn.parent = pIdx < 0 ? root : sk.bones[pIdx]._linkedTransformNode;
    tn.position.set(0, b === 0 ? 0 : 0.06, 0); tn.rotationQuaternion = B.Quaternion.Identity();
    bone.linkTransformNode(tn); }
    if (ANIM !== '0') {
      g.addTargetedAnimation(mkAnim('r', 'rotationQuaternion', B.Animation.ANIMATIONTYPE_QUATERNION, f => B.Quaternion.RotationYawPitchRoll(Math.sin(f * 0.1 + b) * 0.2, 0.05, 0)), tn);
      g.addTargetedAnimation(mkAnim('p', 'position', B.Animation.ANIMATIONTYPE_VECTOR3, f => new B.Vector3(0, (b === 0 ? 0 : 0.06) + 0.005 * Math.sin(f * 0.2), 0)), tn);
    }
  }
  if (ANIM !== '0') { g.start(true, 1, 0, 60); if (LOD>1) g.pause(); }
  SKS.push(sk); GRPS.push(g);
  const mat = UNIQUEMAT ? (MAT === 'pbr' ? new B.PBRMaterial('m' + c, scene) : new B.StandardMaterial('m' + c, scene)) : sharedMat;
  if (mat.albedoColor) mat.albedoColor = new B.Color3(Math.random(), Math.random(), Math.random()); else mat.diffuseColor = new B.Color3(Math.random(), Math.random(), Math.random());
  const parts = [];
  for (let p = 0; p < PARTS; p++) {
    // cylinder tris ~= 2*tess*subdiv (+caps); pick tess=12
    const tess = 12, sub = Math.max(1, Math.round(trisPerPart / (2 * tess)));
    const m = B.MeshBuilder.CreateCylinder('p' + c + '_' + p, { height: 1.8, diameter: 0.5 - p * 0.03, tessellation: tess, subdivisions: sub }, scene);
    const pos = m.getVerticesData('position'); const nv = pos.length / 3;
    const idx = new Float32Array(nv * 4), w = new Float32Array(nv * 4);
    for (let v = 0; v < nv; v++) { const y = pos[v * 3 + 1] + 0.9; const bi = Math.min(NB - 1, Math.floor(y / 1.8 * 6)); idx[v * 4] = bi; idx[v * 4 + 1] = Math.min(NB - 1, bi + 1); idx[v * 4 + 2] = 0; idx[v * 4 + 3] = 0; w[v * 4] = 0.6; w[v * 4 + 1] = 0.3; w[v * 4 + 2] = 0.1; w[v * 4 + 3] = 0; }
    m.setVerticesData('matricesIndices', idx); m.setVerticesData('matricesWeights', w);
    m.material = mat; parts.push(m);
  }
  let meshes = parts;
  if (MERGE) meshes = [B.Mesh.MergeMeshes(parts, true, true)];
  for (const m of meshes) { m.skeleton = sk; m.numBoneInfluencers = 4; m.parent = root; m.alwaysSelectAsActiveMesh = true; m.isPickable = false; }
}
scene.skipPointerMovePicking = true;
const si = new B.SceneInstrumentation(scene); si.captureFrameTime = true; si.captureRenderTime = true; si.captureActiveMeshesEvaluationTime = true; si.captureAnimationsTime = true;
await scene.whenReadyAsync();
let frameNo=0;
if (LOD>1) scene.onBeforeAnimationsObservable.add(()=>{ frameNo++; for (let c=0;c<N;c++) if ((c%LOD)===(frameNo%LOD)) GRPS[c].goToFrame((frameNo*0.5)%60); });
if (OPT==='freeze') { for (const m of scene.materials) m.freeze(); for (const m of scene.meshes) m.doNotSyncBoundingInfo=true; scene.freezeActiveMeshes(); scene.onBeforeRenderObservable.add(()=>{ for (const s of SKS) s.prepare(true); }); }
if (OPT==='aggr') { scene.performancePriority = B.ScenePerformancePriority.Aggressive; }

const gl = engine._gl;
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?';
for (let i = 0; i < 60; i++) scene.render();
let tot = 0, fr = 300, an = 0, rend = 0, act = 0;
for (let i = 0; i < fr; i++) { const t0 = performance.now(); scene.render(); tot += performance.now() - t0; an += si.animationsTimeCounter.current; rend += si.renderTimeCounter.current; act += si.activeMeshesEvaluationTimeCounter.current; }
gl.finish();
window.__result = { renderer, N, NB, PARTS, TRIS, MERGE, MAT, ANIM, UNIQUEMAT, draws: si.drawCallsCounter.current, activeMeshes: scene.getActiveMeshes().length, msPerFrame: +(tot / fr).toFixed(3), animMs: +(an / fr).toFixed(3), renderMs: +(rend / fr).toFixed(3), activeEvalMs: +(act / fr).toFixed(3), totalVerts: scene.getTotalVertices() };
</script></body></html>
